name: hf-most
on:
  push:
    branches: [hf-most]
    paths: ["most/naloga.json"]
permissions:
  contents: write
jobs:
  most:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: hf-most }
      - name: Prenos
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          n = json.load(open("most/naloga.json"))
          log = []
          for p in n.get("put", []):
              r = subprocess.run(["curl","-s","-o","/dev/null","-w","%{http_code}","-X","PUT","-H","Content-Type: image/jpeg","--data-binary","@"+p["file"],p["url"]],capture_output=True,text=True)
              log.append(f"PUT {p['file']} {r.stdout}")
          for g in n.get("get", []):
              os.makedirs(os.path.dirname(g["path"]), exist_ok=True)
              r = subprocess.run(["curl","-sL","-o",g["path"],"-w","%{http_code}",g["url"]],capture_output=True,text=True)
              log.append(f"GET {g['path']} {r.stdout}")
          open("most/log.txt","w").write("\n".join(log)+"\n")
          PY
          cat most/log.txt
      - name: Commit
        run: |
          git config user.name claudinka33
          git config user.email claudinka33@users.noreply.github.com
          git add most
          git commit -m "most: rezultat" || true
          git push
